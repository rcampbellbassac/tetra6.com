<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Church Mac steps</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--muted:#5b6672;--card:#fff;--line:#d7dce2;--accent:#2f6f88;--code:#eef1f4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--fg:#e6e9ed;--muted:#9aa5b1;--card:#1c2228;--line:#2c343d;--accent:#5fb0cc;--code:#0f1317}}
body{background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:24px 16px}
main{max-width:860px;margin:0 auto}h1{font-size:1.5rem}h2{font-size:1.15rem;margin-top:1.8em;border-top:1px solid var(--line);padding-top:1em}
.note,p{color:var(--fg)}code{background:var(--code);padding:1px 5px;border-radius:4px}
.box{position:relative;margin:10px 0}pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:14px 14px 14px 14px;overflow-x:auto;white-space:pre;font:14px/1.45 ui-monospace,Menlo,monospace;margin:0}
.copy{display:block;margin:6px 0 0 auto;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
#gate{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:360px;margin:12vh auto}
input{font-size:18px;padding:8px;width:100%;box-sizing:border-box;margin:8px 0;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#err{color:#c0392b;min-height:1.2em}
</style></head><body><main>

<div id="out"></div></main>

async function open_(){const e=document.getElementById('err');e.textContent='Checking...';
try{const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value.trim()),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
document.getElementById('gate').remove();const o=document.getElementById('out');o.innerHTML=new TextDecoder().decode(pt);
o.querySelectorAll('pre').forEach(p=>{const w=document.createElement('div');w.className='box';p.replaceWith(w);w.appendChild(p);
const b=document.createElement('button');b.className='copy';b.textContent='Copy';b.onclick=async()=>{try{await navigator.clipboard.writeText(p.textContent);b.textContent='Copied';}catch(x){const r=document.createRange();r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');b.textContent='Copied';}setTimeout(()=>b.textContent='Copy',1500)};w.appendChild(b);});
}catch(x){e.textContent='Wrong password';}}
